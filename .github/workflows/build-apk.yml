name: Build Android 17 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Required for Android 17 Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Dependencies & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Configure Stable Android SDK Target
        run: |
          # Hanya ambil versi SDK stabil (angka murni) agar tidak terkena versi beta
          STABLE_API=$(ls $ANDROID_HOME/platforms | grep -E '^android-[0-9]+$' | sed 's/android-//' | sort -n | tail -1)
          STABLE_API=${STABLE_API:-36}
          echo "Using Stable Android API: $STABLE_API"
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = $STABLE_API/g" android/variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = $STABLE_API/g" android/variables.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurum-Ledger-Android17-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
